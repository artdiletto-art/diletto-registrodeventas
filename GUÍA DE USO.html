<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutorial · Registro de ventas · Diletto Artesanal</title>
<style>
:root{--bg:#f6f4ef;--sf:#fff;--ink:#1c2321;--ink2:#5b6760;--ln:#e3e0d8;--ac:#1f6b4a;--acs:#e3f2ea;--hl:#f2b441;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111715;--sf:#19201d;--ink:#e8ede9;--ink2:#aab5af;--ln:#2d3833;--ac:#4cc796;--acs:#1b3328;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111715;--sf:#19201d;--ink:#e8ede9;--ink2:#aab5af;--ln:#2d3833;--ac:#4cc796;--acs:#1b3328;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{margin:0;font-size:clamp(1.3rem,4vw,1.9rem);line-height:1.15;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--ink2);font-size:.95rem}
.ib{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);font-size:1.15rem}
.player{background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:18px;box-shadow:0 12px 36px rgba(0,0,0,.08)}
.screen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.stage{position:relative;width:100%;max-width:360px;margin:0 auto;padding:14px;border-radius:30px;background:linear-gradient(160deg,var(--acs),var(--bg))}
.info small{color:var(--ac);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem}
.info h2{margin:4px 0 6px;font-size:clamp(1.3rem,3.4vw,1.8rem);line-height:1.15}
.info p{margin:0 0 14px;color:var(--ink2)}
.info ol{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.info li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--ln);border-radius:14px;opacity:.55;transition:all .3s}
.info li::before{content:counter(s);flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ln);font-size:.8rem;font-weight:700}
.info li.dn{opacity:.85}.info li.dn::before{background:var(--ac);color:var(--bg)}
.info li.on{opacity:1;border-color:var(--ac);background:var(--acs);transform:translateX(4px)}
.info li.on::before{background:var(--ac);color:var(--bg)}
.bar{height:6px;border-radius:99px;background:var(--ln);margin:18px 0 12px;overflow:hidden}
#fill{height:100%;width:0;background:var(--ac);border-radius:99px;transition:width .5s}
.ctl{display:flex;align-items:center;justify-content:center;gap:10px}
.ctl button{min-width:46px;height:46px;padding:0 14px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);font-weight:700}
.ctl #pl{background:var(--ac);border-color:var(--ac);color:var(--bg);min-width:64px;font-size:1.1rem}
.chs{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:center}
.chs button{padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);font-size:.9rem}
.chs button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tip{margin:14px 0 0;text-align:center;color:var(--ink2);font-size:.85rem}
/* Maqueta de la app */
.m{--mb:#fff;--mi:#1c2321;--mi2:#6a756f;--ml:#e3e0d8;--mf:#f5f4f0;--mg:#1f6b4a;--my:#742284;--mys:#f4e6f7;
background:var(--mb);color:var(--mi);border:1px solid var(--ml);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:9px;min-height:360px;font-size:.9rem;transition:background .5s,color .5s}
.m.dk{--mb:#19201d;--mi:#e8ede9;--mi2:#aab5af;--ml:#2d3833;--mf:#141a18;--mg:#2a8a61;--my:#d9a6e6;--mys:#2c1a33}
.m *{transition:box-shadow .3s,background .4s,opacity .4s,transform .4s}
.tb{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.f,.t,.st,.card,.hero{border:1.5px solid var(--ml);background:var(--mf);border-radius:12px;padding:9px 11px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.c{padding:6px 10px;border-radius:99px;border:1.5px solid var(--ml);text-align:center;font-weight:600;font-size:.82rem}
.c.on2{background:var(--mi);color:var(--mb)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t b,.st b{display:block;color:var(--mg)}
.hero{background:var(--mi);color:var(--mb)}.hero b{display:block;font-size:1.7rem;line-height:1.1}
.b{display:block;text-align:center;padding:10px;border-radius:12px;background:var(--mg);color:#fff;font-weight:700}
.b.yp{background:var(--mys);color:var(--my);border:1.5px solid var(--my)}
.ln{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--ml)}.ln b{margin-left:auto}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ml);display:grid;place-items:center;color:transparent;font-size:.8rem}
.tick.on{background:var(--mg);border-color:var(--mg);color:#fff}
.tag{font-style:normal;font-size:.72rem;padding:2px 8px;border-radius:99px;background:#fbeccb;color:#7a4d06;margin-left:6px}
.qr{width:84px;height:84px;margin:0 auto;border-radius:10px;border:5px solid #fff;background:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/16px 16px}
.rv{opacity:0;transform:translateY(8px)}.rv.on{opacity:1;transform:none}
.ok{padding:9px 11px;border-radius:12px;background:#d9efe2;color:#14532d;font-weight:600;font-size:.84rem}
.toast{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#27342e;color:#fff;border-left:5px solid #f2b441}
.toast .b{margin-left:auto;padding:6px 10px;background:rgba(255,255,255,.15)}
.sp{margin-top:auto}
.pdf{display:flex;gap:8px;align-items:center;padding:10px;border-radius:12px;border:1.5px dashed var(--mg);font-weight:600;word-break:break-all}
.ib2{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ml);display:grid;place-items:center}
.m.dk .ni,.m:not(.dk) .di{display:none}
.hl{box-shadow:0 0 0 3px var(--hl)}
.cur{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:rgba(242,180,65,.5);border:2px solid var(--hl);pointer-events:none;transition:left .7s ease,top .7s ease;z-index:3}
.cur.tap{animation:tap .5s}
@keyframes tap{0%{transform:scale(1)}40%{transform:scale(.6)}100%{transform:scale(1)}}
@media(max-width:820px){.screen{grid-template-columns:1fr}.info{order:2}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
<header>
  <div><h1>Aprende a usar el registro de ventas</h1><p>Diletto Artesanal · tutorial interactivo de 7 lecciones</p></div>
  <button class="ib" id="th" aria-label="Cambiar entre modo claro y oscuro">◐</button>
</header>
<section class="player" aria-label="Reproductor del tutorial">
  <div class="screen">
    <div class="stage" id="stage"><div class="m" id="mock"></div><i class="cur" id="cur"></i></div>
    <div class="info" aria-live="polite">
      <small id="kick"></small><h2 id="ttl"></h2><p id="dsc"></p><ol id="steps"></ol>
    </div>
  </div>
  <div class="bar" role="progressbar" aria-label="Progreso del tutorial"><div id="fill"></div></div>
  <div class="ctl">
    <button id="pv" aria-label="Lección anterior">⏮</button>
    <button id="pl" aria-label="Reproducir o pausar">⏸</button>
    <button id="nx" aria-label="Siguiente paso">⏭</button>
  </div>
  <nav class="chs" id="chs" aria-label="Lecciones"></nav>
  <p class="tip">Atajos: barra espaciadora = pausa · ← → = cambiar de paso</p>
</section>
</main>
<script>
const S=[
{n:'Vender',t:'Registrar una venta',d:'Toma un pedido en segundos desde la pantalla principal.',
 st:['Escribe el nombre del cliente (si lo dejas vacío será “Cliente Varios”).','Elige si es Local o Delivery y si paga en Efectivo o Yape.','Toca el producto en la carta.','Pulsa Registrar: la venta queda guardada.'],
 h:`<div class=tb>Nueva venta</div><div class=f data-s=0>Cliente: <b>Ana</b></div>
<div class=row data-s=1><span class=c>Local</span><span class=c>Delivery</span><span class="c on2">Efectivo</span><span class=c>Yape</span></div>
<div class=grid><div class=t data-s=2>Americana Personal<b>S/ 10.00</b></div><div class=t>Hawaiana Personal<b>S/ 13.00</b></div><div class=t>Pepperoni Personal<b>S/ 10.00</b></div><div class=t>Café<b>S/ 3.00</b></div></div>
<div class="b rv" data-show=2 data-s=3>Registrar · 1× Americana Personal · S/ 10.00</div>
<div class="ok rv sp" data-show=3>✓ Registrado: 1× Americana Personal · Ana</div>`},
{n:'Cuentas',t:'Cuentas y cobros',d:'Cada cliente tiene su cuenta: marca lo que ya salió y cobra cuando quiera.',
 st:['Marca ✓ cada platillo cuando esté listo para entregar.','Si paga con Yape, muestra el QR con el monto exacto.','Toca Confirmar pago: el dinero entra a la caja.'],
 h:`<div class=tb>Cuentas</div><div class=card><b>Ana</b><i class=tag>Por cobrar</i>
<div class=ln><span class="tick rv on" data-show=0 data-s=0>✓</span>1× Americana Personal<b>S/ 10.00</b></div>
<div class="b yp" data-s=1>▦ Cobrar con Yape · S/ 10.00</div></div>
<div class="qr rv" data-show=1></div>
<div class=b data-s=2>Confirmar pago</div>
<div class="ok rv sp" data-show=2>Pago de Ana por S/ 10.00 ingresado a caja</div>`},
{n:'Caja',t:'Caja y arqueo',d:'Comprueba al instante si el efectivo que tienes coincide con el sistema.',
 st:['Mira el total y cuánto entró por Efectivo, Yape y lo que falta cobrar.','Cuenta el efectivo físico y escríbelo en el campo.','Verás si la caja está conforme, con faltante o con sobrante.'],
 h:`<div class=tb>Caja</div><div class=hero data-s=0><small>Total en caja</small><b>S/ 148.00</b></div>
<div class=row><div class=st>Efectivo<b>S/ 98</b></div><div class=st>Yape<b>S/ 50</b></div><div class=st>Por cobrar<b>S/ 30</b></div></div>
<div class=f data-s=1>Efectivo en caja: <b>S/ 98.00</b></div><div class=b>Validar caja</div>
<div class="ok rv" data-show=2 data-s=2>¡Caja conforme! Todo cuadra.</div>`},
{n:'Historial',t:'Corregir y deshacer',d:'Cambia datos al vuelo y recupera cualquier registro eliminado por error.',
 st:['Edita cliente, nota o método de pago directamente en la fila.','El basurero elimina al instante, sin preguntas.','¿Fue un error? Toca Deshacer antes de que desaparezca el aviso.'],
 h:`<div class=tb>Historial</div><div class=card><div class=row><span class=f data-s=0>Ana</span><span class=f>Yape ▾</span></div>
<div class=ln>19:30 · 1× Americana Personal<b>S/ 10.00</b><span class=ib2 data-s=1>🗑</span></div></div>
<div class="toast rv sp" data-show=2>Registro eliminado<span class=b data-s=2>Deshacer</span></div>`},
{n:'Carta',t:'Administrar la carta',d:'Actualiza precios y productos sin tocar el código.',
 st:['Elige la categoría y cambia nombre o precio.','Agrega productos nuevos con nombre y precio.','Eliminar productos o categorías completas también se puede deshacer.'],
 h:`<div class=tb>Carta</div><div class=f>Categoría: <b>Pizzas ▾</b></div>
<div class=row data-s=0><span class=f style="flex:2">Americana Personal</span><span class=f>S/ 10.00</span></div>
<div class=row data-s=1><span class=f style="flex:2">Nuevo producto…</span><span class=f>S/ 0.00</span><span class=b style="flex:none">+</span></div>
<div class="toast rv sp" data-show=2 data-s=2>Categoría eliminada<span class=b>Deshacer</span></div>`},
{n:'Cierre',t:'Cerrar la caja del día',d:'Un PDF con todo el detalle para guardar tus reportes ordenados.',
 st:['Al terminar el día, toca Cerrar caja.','Se descarga el PDF con la fecha en el nombre.','Confirma limpiar la caja para empezar el siguiente día desde cero.'],
 h:`<div class=tb>Historial · Cierre</div><div class=b data-s=0>Cerrar caja y descargar PDF</div>
<div class="pdf rv" data-show=1 data-s=1>📄 Cierre_Caja_2026-11-12.pdf</div>
<div class="card rv" data-show=2 data-s=2><b>¿Limpiar la caja?</b><div class=row style="margin-top:8px"><span class="b yp">Cancelar</span><span class=b>Limpiar</span></div></div>`},
{n:'Tema',t:'Modo claro y oscuro',d:'Trabaja cómodo de día o de noche, en celular o en computadora.',dark:1,
 st:['Toca el botón de sol o luna en la barra superior.','Toda la interfaz cambia y tu elección se recuerda.'],
 h:`<div class=tb>Diletto Artesanal<span class=ib2 data-s=0><span class=ni>🌙</span><span class=di>☀</span></span></div>
<div class=hero data-s=1><small>Caja hoy</small><b>S/ 148.00</b></div>
<div class=grid><div class=t>Americana Personal<b>S/ 10.00</b></div><div class=t>Hawaiana Personal<b>S/ 13.00</b></div></div>
<div class=b>Registrar</div>`}
];
const $=s=>document.querySelector(s),mock=$('#mock'),cur=$('#cur'),stage=$('#stage');
let si=0,st=0,play=!matchMedia('(prefers-reduced-motion:reduce)').matches,done=false,tm;
const cap=()=>S[si].st.length;
function render(){
  const s=S[si];mock.innerHTML=s.h;mock.classList.remove('dk');
  $('#kick').textContent=`Lección ${si+1} de ${S.length}`;$('#ttl').textContent=s.t;$('#dsc').textContent=s.d;
  $('#steps').innerHTML=s.st.map(x=>`<li>${x}</li>`).join('');
  $('#chs').innerHTML=S.map((x,i)=>`<button data-i="${i}" aria-current="${i===si}">${i+1}. ${x.n}</button>`).join('');
  upd();
}
function upd(){
  const s=S[si];
  document.querySelectorAll('#steps li').forEach((li,i)=>{li.classList.toggle('on',i===st);li.classList.toggle('dn',i<st)});
  mock.querySelectorAll('[data-show]').forEach(e=>e.classList.toggle('on',st>=+e.dataset.show));
  mock.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));
  if(s.dark)mock.classList.toggle('dk',st>=1);
  const t=mock.querySelector(`[data-s="${st}"]`);
  if(t){t.classList.add('hl');requestAnimationFrame(()=>{
    const a=t.getBoundingClientRect(),b=stage.getBoundingClientRect();
    cur.style.left=(a.left-b.left+Math.min(a.width*.6,a.width-14))+'px';cur.style.top=(a.top-b.top+a.height/2)+'px';
    cur.classList.remove('tap');void cur.offsetWidth;cur.classList.add('tap');
  })}
  $('#fill').style.width=((si+(st+1)/cap())/S.length*100)+'%';
  $('#pl').textContent=done?'↻':play?'⏸':'▶';
}
function next(){
  if(st<cap()-1){st++;upd()}
  else if(si<S.length-1){si++;st=0;render()}
  else{play=false;done=true;upd()}
}
function loop(){clearTimeout(tm);if(play)tm=setTimeout(()=>{next();loop()},3000)}
function go(i,j=0){si=i;st=j;done=false;render();loop()}
$('#nx').onclick=()=>{done=false;next();loop()};
$('#pv').onclick=()=>{if(st>0)go(si,st-1);else go(Math.max(0,si-1),0)};
$('#pl').onclick=()=>{if(done){play=true;go(0,0);return}play=!play;upd();loop()};
$('#chs').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
document.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();$('#pl').click()}
  else if(e.key==='ArrowRight')$('#nx').click();else if(e.key==='ArrowLeft')$('#pv').click();
});
$('#th').onclick=()=>{
  const r=document.documentElement,oscuro=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=oscuro?'light':'dark';
};
addEventListener('resize',upd);
render();loop();
</script>
</body>
</html>
